# The Temporal Web UI is a separate binary (temporalio/ui-server). Only
# `temporal server start-dev` bundles it into one process, and that path cannot
# take a custom persistence factory -- so it is its own Deployment, exactly as
# it is its own service in deploy/docker-compose.yml.
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: tma
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/part-of: temporal-meets-aerospike
spec:
  selector:
    app.kubernetes.io/name: temporal-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: tma
  labels:
    app.kubernetes.io/name: temporal-ui
    app.kubernetes.io/part-of: temporal-meets-aerospike
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui
        app.kubernetes.io/part-of: temporal-meets-aerospike
    spec:
      # Load-bearing. Kubernetes injects legacy Docker-link environment
      # variables for every Service in the namespace, named
      # <SERVICE>_PORT=tcp://<clusterIP>:<port>.  The Service in this very file
      # is called `temporal-ui`, so the pod is handed
      # TEMPORAL_UI_PORT=tcp://10.43.x.y:8080 -- and ui-server's own config key
      # for the port it listens on is, exactly, TEMPORAL_UI_PORT.  The result is
      # an immediate CrashLoopBackOff:
      #
      #   config file corrupted: yaml: unmarshal errors:
      #     line 6: cannot unmarshal !!str `tcp://1...` into int
      #
      # which names neither Kubernetes nor the Service.  Turning the links off
      # removes the whole collision class rather than the one instance of it;
      # nothing in this pod ever used them (TEMPORAL_ADDRESS is set explicitly
      # below, and DNS is how everything else is found).
      enableServiceLinks: false
      containers:
        - name: ui
          image: temporalio/ui:2.53.3
          env:
            - name: TEMPORAL_ADDRESS
              value: "temporal:7233"
            # Belt and braces: an explicit env var beats an injected service
            # link, so this keeps the pod healthy even if enableServiceLinks
            # above is ever removed.
            - name: TEMPORAL_UI_PORT
              value: "8080"
            # The Ingress routes /temporal here without stripping the prefix,
            # so the UI has to know it is not at the root. Without this the SPA
            # is served fine and then asks for /_app/... at the root, gets the
            # control plane's 404, and renders a blank page.
            - name: TEMPORAL_UI_PUBLIC_PATH
              value: "/temporal"
            # The browser talks to ui-server, and ui-server proxies to the
            # frontend, so CORS does not come up for normal use. Set it if you
            # point a codec server or an external client at this UI.
            # - name: TEMPORAL_CORS_ORIGINS
            #   value: "http://demo.example.com"
          ports:
            - { name: http, containerPort: 8080 }
          # tcpSocket rather than httpGet: with a public path set, / is a 404
          # and the served path is an implementation detail of ui-server. A
          # probe that asserts the URL layout would fail closed on a UI upgrade
          # for no safety benefit -- this pod has no state to be wrong about.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
