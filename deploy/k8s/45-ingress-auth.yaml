# Basic auth at the ingress, not only in the control plane.
#
# The control plane enforces its own basic auth, but the ingress routes
# /temporal straight to the Temporal Web UI, which never sees that code. Without
# this middleware the UI is reachable unauthenticated -- workflow histories
# readable, and terminate/cancel available to anyone with the URL.
#
# Putting auth on the ingress covers both paths with one credential. The Go
# service's own check stays as a second layer.
#
# There is a licensing dimension too: the Aerospike evaluation terms limit
# access to people with a need to have it, so an open demo box is outside the
# grant. See docs/07-hosting-options.md.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: demo-auth
  namespace: tma
  labels:
    app.kubernetes.io/part-of: temporal-meets-aerospike
spec:
  basicAuth:
    # References a Secret that is deliberately NOT in this repo. Create it on
    # the box, so the credential never lands in git:
    #
    #   PASS=$(openssl rand -base64 18)
    #   kubectl -n tma create secret generic ingress-basic-auth \
    #     --from-literal=users="demo:$(openssl passwd -apr1 "$PASS")"
    #
    # Traefik accepts MD5 (apr1), SHA1 or bcrypt hashes here.
    secret: ingress-basic-auth
    realm: "Temporal on Aerospike — demo"

---
# Redirect http:// to https://.
#
# Without this the ingress happily answers on port 80, so a plain-HTTP request
# is challenged for basic auth and the password crosses the wire in clear text.
# The redirect must run BEFORE the auth middleware -- middlewares apply in the
# order listed on the router, and redirecting first means an http:// visitor is
# never asked for credentials over an unencrypted connection.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: tma
  labels:
    app.kubernetes.io/part-of: temporal-meets-aerospike
spec:
  redirectScheme:
    scheme: https
    permanent: true
