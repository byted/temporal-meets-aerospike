# Traefik ships with k3s and is already the default IngressClass, so this needs
# no controller install.
#
# A `host:` rule is required now that TLS is on: cert-manager derives the
# certificate's names from it, and Traefik needs it to select the right
# certificate. Reaching the box by bare IP therefore 404s, which is the
# trade-off for having a certificate at all.
#
# Path routing, not prefix stripping: /temporal reaches ui-server *with* the
# prefix intact, and ui-server is told about it via TEMPORAL_UI_PUBLIC_PATH.
# Traefik orders ingress rules by matcher specificity, so /temporal wins over /.
#
# `temporal-meets-aerospike.example.com` below is a placeholder -- example.com is
# reserved by RFC 2606 and will never resolve. Substitute a hostname whose A
# record already points at the box: cert-manager asks Let's Encrypt to validate
# it over HTTP-01, so DNS has to be correct *before* this is applied or the
# challenge fails and burns rate limit. It appears twice, and both must match.
# Set the ACME contact address in 46-cert-manager-issuers.yaml at the same time.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: tma
  labels:
    app.kubernetes.io/part-of: temporal-meets-aerospike
  annotations:
    # Applies to every path below, including /temporal -- which bypasses the
    # control plane's own auth entirely. See 45-ingress-auth.yaml.
    # Order matters: redirect to HTTPS first, so an http:// request is never
    # asked for a password over plaintext.
    traefik.ingress.kubernetes.io/router.middlewares: tma-redirect-https@kubernetescrd,tma-demo-auth@kubernetescrd
    # Switch to letsencrypt-staging when testing changes to this ingress, so a
    # broken solver does not burn the production rate limit.
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - temporal-meets-aerospike.example.com
      secretName: demo-tls
  rules:
    - host: temporal-meets-aerospike.example.com
      http:
        paths:
          - path: /temporal
            pathType: Prefix
            backend:
              service:
                name: temporal-ui
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  name: http

# --- TLS ---------------------------------------------------------------------
#
# Left off because a fresh VM reached by IP cannot pass an ACME HTTP-01
# challenge, and a half-working cert is worse than none.
#
# To enable, once the box has a DNS name that resolves to it publicly:
#
#   1. Install cert-manager:
#        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
#
#   2. Create a ClusterIssuer (HTTP-01 through the same Traefik):
#        apiVersion: cert-manager.io/v1
#        kind: ClusterIssuer
#        metadata:
#          name: letsencrypt
#        spec:
#          acme:
#            server: https://acme-v02.api.letsencrypt.org/directory
#            email: you@example.com
#            privateKeySecretRef:
#              name: letsencrypt-account-key
#            solvers:
#              - http01:
#                  ingress:
#                    ingressClassName: traefik
#
#   3. Add to the Ingress above -- the annotation, a host on the rule, and the
#      tls block. cert-manager watches for exactly this combination and fills
#      in the Secret itself:
#
#        metadata:
#          annotations:
#            cert-manager.io/cluster-issuer: letsencrypt
#            traefik.ingress.kubernetes.io/router.entrypoints: websecure
#        spec:
#          tls:
#            - hosts: [demo.example.com]
#              secretName: demo-tls
#          rules:
#            - host: demo.example.com     # required: the rule can no longer be hostless
#              http: ...
#
# The control plane holds credentials in a basic-auth header. Until TLS is on,
# those cross the network in the clear -- treat the demo box as untrusted.
