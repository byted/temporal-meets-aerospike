# Let's Encrypt issuers, solved over HTTP-01 through the Traefik that k3s
# already runs.
#
# Two issuers on purpose. Staging first: a failed HTTP-01 validation counts
# against Let's Encrypt's rate limit (5 failures per account, per hostname, per
# hour), and this ingress puts basic auth on every path -- so it is worth
# proving the solver is reachable before spending production attempts.
#
# cert-manager creates its own temporary Ingress for the challenge path. That
# route is more specific than this project's `/` catch-all, so Traefik sends the
# challenge to the solver rather than to the authenticated backend. Verify that
# rather than assume it: with staging selected, the Certificate should reach
# Ready without a 401 appearing in the challenge.
#
# Requires cert-manager:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.1/cert-manager.yaml
#
# `demo@example.com` is a placeholder, in both issuers. Let's Encrypt uses the
# ACME contact address for expiry warnings and account recovery, so put a real
# mailbox there before applying -- an address nobody reads means the first
# notice of a problem is the browser warning.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: demo@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: demo@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
