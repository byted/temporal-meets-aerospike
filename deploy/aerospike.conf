# Aerospike configuration for the Temporal PoC.
#
# Single node, strong-consistency (SC) namespace. SC is required because
# multi-record transactions (MRT) only work in SC namespaces, and Temporal's
# persistence contract needs both:
#   - MRT, to reproduce Cassandra's single-partition conditional batches
#   - quorum-consistent reads, or history tasks can be silently lost
#
# SC and MRT are Enterprise-only features. The EE container image ships a
# perpetual single-node evaluation feature key (server 6.1+) that includes
# `asdb-strong-consistency`, so no key needs to be mounted here.

service {
    cluster-name temporal-poc
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000

        # Aerospike clients talk directly to every node; there is no proxy in
        # the data path. The client tends the cluster and then connects to
        # whatever address a node advertises.
        #
        # Unset `access-address` means the node advertises its container IP on
        # the compose network. That is what the temporal-server container uses.
        #
        # A host-side client (the conformance suites run on the host, against
        # the published port) cannot reach that container IP, so it sets
        # ClientPolicy.UseServicesAlternate and gets this address instead.
        alternate-access-address 127.0.0.1
    }

    heartbeat {
        mode mesh
        port 3002
        interval 150
        timeout 10
    }

    fabric {
        port 3001
    }

    info {
        port 3003
    }
}

namespace temporal {
    # A single-node SC cluster must have replication-factor equal to the
    # cluster size. SC requires at least as many nodes as the replication
    # factor, so RF1 is the only valid setting here.
    replication-factor 1
    strong-consistency true

    # Nothing in the operational store expires on a wall clock: Temporal
    # deletes explicitly. Leaving NSUP off avoids the TTL/durable-delete
    # interactions that transactions are documented not to mix with.
    default-ttl 0
    nsup-period 0

    # The 7.1+ default is 1 MiB. Mutable state is one record holding execution
    # info plus six collection bins, and every update rewrites the whole
    # record, so we raise this to the 8 MiB hard ceiling and rely on Temporal's
    # own TransactionSizeLimit to stay under it.
    max-record-size 8M

    storage-engine memory {
        file /opt/aerospike/data/temporal.dat
        filesize 4G
    }
}
